version: '3.8'
services:
  bnf-selenium-hub:
    # Matches cks-gatsby, which runs the same wdio 8.46.0 / cucumber 9 stack with
    # its functional-test performance work removed and does not show the roaming
    # 60s command stalls this repo does. 4.1.2-20220217 is February 2022: the
    # stall signature (a command in flight for 120s while the browser sits idle
    # and healthy, no pending requests, and diagnostics running fine on the SAME
    # session) puts the lost response in the hub/router, which is the layer this
    # bump replaces.
    image: selenium/hub:4.8.0
    container_name: bnf-selenium-hub
    ports:
      - '4442:4442'
      - '4443:4443'
      - '4444:4444'
    environment:
      # When using headless browser mode, there's no need for the Xvfb server to be started.
      - START_XVFB=false
      # Avoid IPv6 issues in Chrome, see https://stackoverflow.com/a/63310211/486434
      - JAVA_OPTS=-Dwebdriver.chrome.whitelistedIps=

  bnf-selenium-chrome:
    # Chrome 98 -> 110, pinned to the same tag cks-gatsby uses. Expect a11y
    # results to move: axe-core reports against whatever the browser renders, so
    # twelve Chrome releases can add or drop violations in the 78 accessibility
    # scenarios here. That is the main risk in this bump, and it is why it is a
    # separate commit that can be reverted on its own.
    image: selenium/node-chrome:110.0.5481.77-20230210
    #container_name: bnf-selenium-chrome
    shm_size: '2gb'
    depends_on:
      - bnf-selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=bnf-selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443

  bnf-test-runner:
    build:
      context: .
      args:
        - NPM_TOKEN
    container_name: bnf-test-runner
    depends_on:
      - bnf-selenium-hub
      - bnf-website
      - bnfc-website
    environment:
      - TEAMCITY_VERSION
    volumes:
      - ./:/bnf-gatsby/tests
      - /bnf-gatsby/tests/node_modules/

  bnf-website:
    image: nginx:1.21.6-alpine
    container_name: bnf-website
    depends_on:
      - mock-api
    environment:
      - NGINX_HOST=bnf-functional-tests.nice.org.uk
    volumes:
      # We expect the built BNF website to have been copied into this bnf-website-build folder.
      # This happens automatically if you run `npm run build:bnf` from the Gatsby folder
      - ./bnf-website-build:/usr/share/nginx/html
    networks:
      default:
        aliases:
          # Make sure the app uses a nice.org.uk domain so that the cookie banner license works
          - bnf-functional-tests.nice.org.uk

  bnfc-website:
    image: nginx:1.21.6-alpine
    container_name: bnfc-website
    depends_on:
      - mock-api
    environment:
      - NGINX_HOST=bnfc-functional-tests.nice.org.uk
    volumes:
      - ./bnfc-website-build:/usr/share/nginx/html
    networks:
      default:
        aliases:
          - bnfc-functional-tests.nice.org.uk

  mock-api:
    build: https://github.com/nice-digital/mocks-apis.git#main:search-apis
    container_name: mock-api
    networks:
      default:
        aliases:
          # The TC pipeline has a build step that switches between these two urls
          # If the branch == main it will point to the live endpoint otherwise point to beta
          - beta-search-api.nice.org.uk
          - search-api.nice.org.uk

networks:
  default:
    name: bnf-gatsby-functional-tests
